<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support & Help - LumiHealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --text-dark: #0f172a;
            --text-gray: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            color: var(--text-dark); position: relative; padding: 2rem 1rem;
        }
        .bg-element { position: fixed; top: -150px; left: -50px; width: 600px; height: 600px; background: rgba(56, 189, 248, 0.2); border-radius: 50%; filter: blur(80px); z-index: -1; }

        .container {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 28px;
            padding: 3rem; width: 100%; max-width: 800px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1);
        }
        
        .header-wrap { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
        .icon-box {
            width: 50px; height: 50px; background: #e0f2fe; color: #0ea5e9;
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; box-shadow: 0 4px 10px rgba(14, 165, 233, 0.15);
        }
        h2 { font-size: 1.8rem; font-weight: 700; color: #1e293b; }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        /* Emergency Info Section */
        .emergency-card {
            background: var(--danger-light);
            border: 2px solid #fecaca;
            border-radius: 16px;
            padding: 1.5rem;
        }
        .emergency-header { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem; color: var(--danger); font-weight: 700; font-size: 1.2rem; }
        .emergency-header span { font-size: 1.5rem; }
        
        .contact-line { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 1rem; background: white; padding: 1rem; border-radius: 12px; box-shadow: 0 2px 4px rgba(239, 68, 68, 0.05); }
        .contact-line:last-child { margin-bottom: 0; }
        .contact-icon { font-size: 1.4rem; color: var(--danger); }
        .contact-info h4 { color: #1e293b; margin-bottom: 0.2rem; font-size: 1rem; }
        .contact-info p { color: var(--danger); font-weight: 700; font-size: 1.1rem; }
        .contact-info p.sub { color: var(--text-gray); font-weight: 400; font-size: 0.85rem; margin-top: 0.1rem;}

        /* Contact Form */
        form { display: flex; flex-direction: column; gap: 1.2rem; }
        .form-title { font-size: 1.2rem; font-weight: 600; color: #334155; margin-bottom: 0.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        label { font-weight: 600; font-size: 0.9rem; color: #475569; }
        input, textarea {
            width: 100%; padding: 0.85rem 1rem;
            border: 1.5px solid #e2e8f0; border-radius: 12px;
            font-size: 0.95rem; color: #1e293b; background: rgba(255,255,255,0.7);
            outline: none; transition: all 0.3s;
        }
        textarea { resize: vertical; min-height: 100px; }
        input:focus, textarea:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1); }
        
        button {
            background: var(--primary); color: white; border: none;
            padding: 1rem; border-radius: 12px; font-size: 1.05rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s; margin-top: 0.5rem;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
        }
        button:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(14, 165, 233, 0.3); }

        .back-link {
            display: inline-flex; align-items: center; gap: 0.5rem;
            margin-top: 2rem; color: var(--text-gray); text-decoration: none;
            font-weight: 500; transition: color 0.3s;
        }
        .back-link:hover { color: var(--primary); }
        
        @media (max-width: 768px) {
            .content-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-element"></div>

    <div class="container">
        <div class="header-wrap">
            <div class="icon-box">💬</div>
            <h2>Support & Help</h2>
        </div>

        <div class="content-grid">
            
            <!-- Emergency Section -->
            <div class="emergency-card">
                <div class="emergency-header">
                    <span>🚨</span> Immediate Assistance
                </div>
                
                <div class="contact-line">
                    <div class="contact-icon">📞</div>
                    <div class="contact-info">
                        <h4>Medical Emergency</h4>
                        <p>911 / 112</p>
                        <p class="sub">Available 24/7 constantly</p>
                    </div>
                </div>

                <div class="contact-line">
                    <div class="contact-icon">🏥</div>
                    <div class="contact-info">
                        <h4>Hospital Reception</h4>
                        <p>+1 (800) 555-0199</p>
                        <p class="sub">Open for urgent inquiries</p>
                    </div>
                </div>
                
                <div class="contact-line">
                    <div class="contact-icon">🚑</div>
                    <div class="contact-info">
                        <h4>Ambulance Dispatch</h4>
                        <p>+1 (800) 555-0100</p>
                        <p class="sub">Rapid emergency transport</p>
                    </div>
                </div>
            </div>

            <!-- Contact Form -->
            <div class="support-form">
                <h3 class="form-title">Send us a Message</h3>
                <form onsubmit="sendMessage(event)">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" placeholder="John Doe" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="john@example.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label>How can we help you?</label>
                        <textarea placeholder="Describe your issue or question..." required></textarea>
                    </div>

                    <button type="submit">Send Message</button>
                </form>
            </div>

        </div>

        <a href="dashboard.html" class="back-link">
            &larr; Back to Dashboard
        </a>
    </div>

    <script>
        function sendMessage(e) {
            e.preventDefault();
            alert('Thank you! Your support request has been sent successfully. Our team will get back to you shortly.');
            e.target.reset();
        }
    </script>
</body>
</html>
