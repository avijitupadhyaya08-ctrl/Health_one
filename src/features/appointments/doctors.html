<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Doctors - LumiHealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;      
            --primary-dark: #2563eb;
            --primary-light: #eff6ff;
            --text-dark: #0f172a;
            --text-gray: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #bfdbfe 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            color: var(--text-dark); position: relative; padding: 2rem 1rem;
            overflow-x: hidden;
        }
        .bg-element { position: fixed; top: -100px; right: -100px; width: 600px; height: 600px; background: rgba(59, 130, 246, 0.15); border-radius: 50%; filter: blur(80px); z-index: -1; }
        .bg-element-2 { position: fixed; bottom: -100px; left: -100px; width: 500px; height: 500px; background: rgba(14, 165, 233, 0.15); border-radius: 50%; filter: blur(80px); z-index: -1; }

        .container {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 28px;
            padding: 3rem; width: 100%; max-width: 900px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.08);
            position: relative;
        }
        
        .header-wrap { display: flex; align-items: center; gap: 1rem; margin-bottom: 2.5rem; }
        .icon-box {
            width: 55px; height: 55px; background: var(--primary-light); color: var(--primary);
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.15);
        }
        h2 { font-size: 2rem; font-weight: 700; color: #1e293b; }
        .header-wrap p { color: var(--text-gray); margin-top: 0.2rem;}

        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .doctor-card {
            background: white; border-radius: 20px; padding: 1.5rem;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #f1f5f9; transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .doctor-card::before {
            content: ''; position: absolute; top:0; left:0; width:100%; height:4px;
            background: var(--primary); opacity: 0; transition: opacity 0.3s;
        }

        .doctor-card:hover {
            transform: translateY(-5px); box-shadow: 0 15px 30px rgba(59, 130, 246, 0.12); border-color: rgba(59, 130, 246, 0.3);
        }
        .doctor-card:hover::before { opacity: 1; }

        .doc-avatar {
            width: 80px; height: 80px; background: #f8fafc; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; margin-bottom: 1rem; border: 3px solid #eff6ff;
        }
        .doc-info h3 { font-size: 1.25rem; font-weight: 700; color: #1e293b; margin-bottom: 0.3rem;}
        .doc-info .specialty {
            display: inline-block; background: var(--primary-light); color: var(--primary-dark);
            padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            margin-bottom: 1rem;
        }

        .book-btn {
            background: var(--primary); color: white; text-decoration: none; border: none;
            padding: 0.8rem 1.5rem; border-radius: 12px; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s; width: 100%; display: block;
        }
        .book-btn:hover { background: var(--primary-dark); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25); }

        .back-link {
            display: inline-flex; align-items: center; gap: 0.5rem;
            margin-top: 2.5rem; color: var(--text-gray); text-decoration: none;
            font-weight: 500; transition: color 0.3s;
        }
        .back-link:hover { color: var(--primary); }

        @media (max-width: 768px) {
            .container { padding: 2rem 1.5rem; }
            .header-wrap { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="bg-element"></div>
    <div class="bg-element-2"></div>

    <div class="container">
        <div class="header-wrap">
            <div class="icon-box">👨‍⚕️</div>
            <div>
                <h2>Our Specialists</h2>
                <p>Find and book an appointment with our highly rated doctors.</p>
            </div>
        </div>

        <div class="doctors-grid">
            
            <!-- Doctor 1 -->
            <div class="doctor-card">
                <div class="doc-avatar">👨‍⚕️</div>
                <div class="doc-info">
                    <h3>Dr. Smith</h3>
                    <span class="specialty">Cardiologist</span>
                </div>
                <a href="appointments.html" class="book-btn">Book Now</a>
            </div>

            <!-- Doctor 2 -->
            <div class="doctor-card">
                <div class="doc-avatar">👩‍⚕️</div>
                <div class="doc-info">
                    <h3>Dr. Jane</h3>
                    <span class="specialty">Dentist</span>
                </div>
                <a href="appointments.html" class="book-btn">Book Now</a>
            </div>

            <!-- Doctor 3 -->
            <div class="doctor-card">
                <div class="doc-avatar">👨‍⚕️</div>
                <div class="doc-info">
                    <h3>Dr. Allen</h3>
                    <span class="specialty">General Physician</span>
                </div>
                <a href="appointments.html" class="book-btn">Book Now</a>
            </div>

            <!-- Doctor 4 -->
            <div class="doctor-card">
                <div class="doc-avatar">👩‍⚕️</div>
                <div class="doc-info">
                    <h3>Dr. Perez</h3>
                    <span class="specialty">Neurologist</span>
                </div>
                <a href="appointments.html" class="book-btn">Book Now</a>
            </div>

        </div>

        <a href="main.html" class="back-link">
            &larr; Back to Hub
        </a>
    </div>
</body>
</html>
