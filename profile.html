<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - LumiHealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --text-dark: #0f172a;
            --text-gray: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 50%, #a7f3d0 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            color: var(--text-dark); position: relative; padding: 2rem 1rem;
        }
        .bg-element { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 700px; height: 700px; background: rgba(52, 211, 153, 0.2); border-radius: 50%; filter: blur(100px); z-index: -1; }

        .container {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 28px;
            padding: 3rem 2.5rem; width: 100%; max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.08); 
        }
        
        .header { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 1.5rem; }
        .avatar-wrap {
            width: 80px; height: 80px; background: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.15); 
            border: 3px solid var(--primary-light); position: relative;
        }
        .status-dot {
            position: absolute; bottom: 3px; right: 3px; width: 14px; height: 14px;
            background: #10b981; border: 2px solid white; border-radius: 50%;
        }
        .header-info h2 { font-size: 1.8rem; font-weight: 700; color: #1e293b; margin-bottom: 0.2rem; }
        .header-info p { color: var(--text-gray); font-size: 0.95rem; }

        form { display: flex; flex-direction: column; gap: 1.25rem; }
        .form-section { background: white; padding: 1.5rem; border-radius: 16px; border: 1px solid #f1f5f9; margin-bottom: 1rem;}
        .section-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; color: #334155; }
        
        .input-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.2rem;}
        label { font-size: 0.9rem; font-weight: 600; color: #475569; }
        input {
            width: 100%; padding: 0.8rem 1rem;
            border: 1.5px solid #e2e8f0; border-radius: 10px;
            outline: none; transition: all 0.3s;
            font-size: 0.95rem; background: #f8fafc;
        }
        input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); }
        
        .row { display: flex; gap: 1rem; }
        .row > .input-group { flex: 1; margin-bottom: 0;}

        button {
            background: var(--primary); color: white; border: none;
            padding: 0.85rem; border-radius: 10px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s; width: 100%;
        }
        button:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(16, 185, 129, 0.2); }

        .back-link {
            display: inline-flex; align-items: center; gap: 0.5rem;
            margin-top: 1.5rem; color: var(--text-gray); text-decoration: none;
            font-weight: 500; transition: color 0.3s;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
    <div class="bg-element"></div>

    <div class="container">
        
        <div class="header">
            <div class="avatar-wrap">
                👨‍🦱
                <div class="status-dot"></div>
            </div>
            <div class="header-info">
                <h2>User Profile</h2>
                <p>Manage your account details and security.</p>
            </div>
        </div>

        <div class="form-section">
            <h3 class="section-title">Edit Personal Details</h3>
            <form onsubmit="saveProfile(event)">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" value="John Doe" required>
                </div>
                
                <div class="row" style="margin-bottom: 1.2rem;">
                    <div class="input-group">
                        <label>Age</label>
                        <input type="number" value="25" required>
                    </div>
                    <div class="input-group">
                        <label>Blood Group</label>
                        <input type="text" value="O+">
                    </div>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" value="john@example.com" required>
                </div>
                <button type="submit">Save Changes</button>
            </form>
        </div>

        <div class="form-section" style="margin-bottom: 0;">
            <h3 class="section-title">Change Password</h3>
            <form onsubmit="changePassword(event)">
                <div class="input-group">
                    <label>Current Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <div class="row">
                    <div class="input-group">
                        <label>New Password</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    <div class="input-group">
                        <label>Confirm Password</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" style="background:#0f172a; margin-top:0.5rem;">Update Password</button>
            </form>
        </div>

        <a href="dashboard.html" class="back-link">
            &larr; Back to Dashboard
        </a>
    </div>

    <script>
        function saveProfile(e) {
            e.preventDefault();
            alert('Your personal details have been updated successfully!');
        }

        function changePassword(e) {
            e.preventDefault();
            alert('Your password has been changed securely.');
            e.target.reset(); // clear the password fields
        }
    </script>
</body>
</html>
