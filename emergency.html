<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency SOS - LumiHealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ef4444; 
            --primary-dark: #dc2626;
            --primary-light: #fee2e2;
            --text-dark: #0f172a;
            --text-gray: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 50%, #fecaca 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            color: var(--text-dark); position: relative; padding: 2rem 1rem; overflow-x: hidden;
        }

        .bg-element { position: absolute; top: 10%; right: -50px; width: 600px; height: 600px; background: rgba(239, 68, 68, 0.15); border-radius: 50%; filter: blur(80px); z-index: -1; }
        
        .container {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 28px;
            padding: 4rem 3rem; width: 100%; max-width: 550px;
            box-shadow: 0 25px 50px -12px rgba(239, 68, 68, 0.15);
            text-align: center;
            position: relative;
        }

        .header-wrap { margin-bottom: 2.5rem; }
        .icon-box {
            width: 80px; height: 80px; background: var(--primary-light); color: var(--primary);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; margin: 0 auto 1rem auto; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.15);
        }
        h2 { font-size: 2.5rem; font-weight: 800; color: #1e293b; margin-bottom: 0.5rem;}
        .header-wrap p { color: var(--text-gray); font-size: 1.1rem; line-height: 1.5; }

        .sos-btn {
            background: var(--primary); color: white; border: none;
            width: 250px; height: 250px; border-radius: 50%;
            font-size: 3.5rem; font-weight: 800; letter-spacing: 2px;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(239, 68, 68, 0.4), inset 0 -10px 20px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem;
            margin: 0 auto 2.5rem auto;
            position: relative;
        }
        .sos-btn::before {
            content: ''; position: absolute; top: -15px; left: -15px; right: -15px; bottom: -15px;
            border-radius: 50%; border: 3px solid rgba(239, 68, 68, 0.3);
            animation: pulse 2s infinite; z-index: -1;
        }
        .sos-btn:hover { transform: scale(1.05); background: var(--primary-dark); box-shadow: 0 20px 45px rgba(239, 68, 68, 0.5), inset 0 -10px 20px rgba(0,0,0,0.2); }
        .sos-btn:active { transform: scale(0.95); }
        .btn-sub { font-size: 1.1rem; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9;}

        .input-group { margin-bottom: 1.5rem; text-align: left; }
        label { font-size: 0.95rem; font-weight: 600; color: #334155; margin-bottom: 0.5rem; display: block; }
        input {
            width: 100%; padding: 1rem;
            border: 2px solid #e2e8f0; border-radius: 12px;
            outline: none; transition: all 0.3s;
            font-size: 1rem; background: white; text-align: center;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1); }

        .back-link {
            display: inline-flex; align-items: center; gap: 0.5rem;
            color: var(--text-gray); text-decoration: none;
            font-weight: 500; transition: color 0.3s;
        }
        .back-link:hover { color: var(--text-dark); }

        #status-msg { margin-top: 1rem; font-weight: 600; color: var(--primary); min-height: 1.5rem; }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            100% { transform: scale(1.15); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="bg-element"></div>

    <div class="container">
        <div class="header-wrap">
            <div class="icon-box">🚨</div>
            <h2>EMERGENCY SOS</h2>
            <p>One tap will grab your exact location and immediately open your messaging app to send an urgent help request.</p>
        </div>

        <div class="input-group">
            <label>Emergency Contact Number (Optional)</label>
            <input type="tel" id="contact-num" placeholder="e.g. +1234567890">
        </div>

        <button class="sos-btn" onclick="triggerSOS()">
            SOS
            <span class="btn-sub">Tap for Help</span>
        </button>

        <p id="status-msg"></p>

        <a href="dashboard.html" class="back-link" style="margin-top: 2rem;">
            &larr; Cancel and Return to Dashboard
        </a>
    </div>

    <script>
        function triggerSOS() {
            const statusMsg = document.getElementById('status-msg');
            statusMsg.style.color = '#0f172a';
            statusMsg.innerHTML = "Acquiring your location securely... 📡";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        // Google Maps standard pin link
                        const mapsLink = `https://www.google.com/maps?q=${lat},${lng}`;
                        
                        const message = `🚨 EMERGENCY!\nI need help.\nMy location: ${mapsLink}`;
                        const encodeMsg = encodeURIComponent(message);
                        
                        const contactNum = document.getElementById('contact-num').value.replace(/[^0-9+]/g, '');
                        
                        let url = "";
                        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

                        if(contactNum) {
                            if(isMobile) {
                                // Native Whatsapp Launch
                                url = `whatsapp://send?phone=${contactNum}&text=${encodeMsg}`;
                            } else {
                                // Desktop Web Whatsapp
                                url = `https://web.whatsapp.com/send?phone=${contactNum}&text=${encodeMsg}`;
                            }
                        } else {
                            if(isMobile) {
                                // Native SMS Launch without number
                                url = `sms:?body=${encodeMsg}`;
                            } else {
                                // Generic fallback
                                url = `https://web.whatsapp.com/send?text=${encodeMsg}`;
                            }
                        }
                        
                        statusMsg.style.color = '#10b981';
                        statusMsg.innerHTML = "Location acquired! Opening messaging app... ✅";
                        
                        window.open(url, "_blank");
                    },
                    (error) => {
                        statusMsg.style.color = '#ef4444';
                        statusMsg.innerHTML = "❌ Failed to acquire location. Please ensure location services are enabled.";
                    }
                );
            } else {
                statusMsg.style.color = '#ef4444';
                statusMsg.innerHTML = "❌ Geolocation is not supported by your browser.";
            }
        }
    </script>
</body>
</html>
